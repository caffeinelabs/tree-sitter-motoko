[[case]]
why = "preserve: layout: a comma-separated list is re-spaced but neither separator nor paren is touched"
source = 'let t = (1,2)'
output = '''
let t = (1, 2)
'''

[[case]]
why = "preserve: layout: a trailing comma is meaning-bearing and so is reproduced, not normalised away"
source = 'let t = (1,)'
output = '''
let t = (1,)
'''

[[case]]
why = "preserve: layout: a redundant paren is left alone — `preserve` does not unwrap, that is a moc2 edit"
source = 'let t = (1)'
output = '''
let t = (1)
'''

[[case]]
why = "preserve: layout: an array literal is a comma-separated list like a tuple"
source = 'let a = [1,2,3]'
output = '''
let a = [1, 2, 3]
'''

[[case]]
why = "preserve: layout: the array family honours a trailing comma too"
source = 'let a = [1,]'
output = '''
let a = [1,]
'''

[[case]]
why = "preserve: layout: a broken record stays broken, with the source’s trailing `;`"
source = '''
let r = {
  a = 1;
  b = 2;
}'''
output = '''
let r = {
  a = 1;
  b = 2;
}
'''

[[case]]
why = "preserve: layout: a broken record without a trailing `;` stays without one"
source = '''
let r = {
  a = 1
}'''
output = '''
let r = {
  a = 1
}
'''

[[case]]
why = "preserve: layout: a block’s inter-declaration `;` is the source’s, and its absence after `x` too"
source = 'func f() : Nat { let x = 1; x }'
output = '''
func f() : Nat { let x = 1; x }
'''

[[case]]
why = "preserve: layout: a block that ends in `;` keeps it — the one place `semi` would differ"
source = 'func f() : Nat { let x = 1; x; }'
output = '''
func f() : Nat { let x = 1; x; }
'''

[[case]]
why = "preserve: layout: an import’s braced pattern is a list, and `a; b` are two names, not a path"
source = '''
import {
  a;
  b
} = "mo:x"'''
output = '''
import {
  a;
  b
} = "mo:x"
'''

[[case]]
why = "preserve: layout: the `;` between switch arms is a real token in the tree, so preserve keeps it"
source = 'switch (x) { case (1) { 1 }; case (2) { 2 } }'
output = '''
switch (x) { case (1) { 1 }; case (2) { 2 } }
'''

[[case]]
why = "preserve: layout: angle brackets are a list family with their own separator character"
source = 'type T2<X, Y> = (X, Y)'
output = '''
type T2<X, Y> = (X, Y)
'''

[[case]]
why = "preserve: layout: a self-referential type alias nests a tuple inside angle brackets"
source = 'type List<A> = ?(A, List<A>)'
output = '''
type List<A> = ?(A, List<A>)
'''

[[case]]
why = "preserve: layout: a block-headed construct does not flatten into its head"
source = 'let x = do ? { 1 }'
output = '''
let x = do ? { 1 }
'''

[[case]]
why = "preserve: layout: an empty object body is `{}` with no interior space"
source = 'actor Palindrome { }'
output = '''
actor Palindrome {}
'''

[[case]]
why = "preserve: layout: a chain broken before its operators stays broken there"
source = '''
let x = aaaa
  + bbbb
  + cccc;'''
output = '''
let x = aaaa
  + bbbb
  + cccc;
'''

[[case]]
why = "preserve: comments: a block comment before an item stays on its line"
source = '''
let a = [
  /* first */ 1,
  2
];'''
output = '''
let a = [
  /* first */ 1,
  2
];
'''

[[case]]
why = "preserve: comments: a comment that ends a line stays on it, and the next declaration starts a fresh line"
source = '''
let x = 1; // hi
let y = 2'''
output = '''
let x = 1; // hi
let y = 2
'''

[[case]]
why = "preserve: comments: a block comment on a declaration’s line is pushed off it rather than absorbed"
source = '/* hi */ let x = 1'
output = '''
/* hi */
let x = 1
'''

[[case]]
why = "preserve: comments: a doc comment is a comment kind of its own and keeps its own line"
source = '''
/// doc
let x = 1'''
output = '''
/// doc
let x = 1
'''

[[case]]
why = "preserve: comments: a comment inside a record forces the record open, and keeps the line the author gave it"
source = '''
{ a = 1; // c
 b = 2 }'''
output = '''
{
  a = 1; // c
  b = 2
}
'''

[[case]]
why = "preserve: comments: a line comment never absorbs the item after it"
source = '''
let r = {
  aaaaaaaaaaaaaaaaaaaa = 1; // a long enough comment to matter
  b = 2
}'''
output = '''
let r = {
  aaaaaaaaaaaaaaaaaaaa = 1; // a long enough comment to matter
  b = 2
}
'''

[[case]]
why = "preserve: blank lines: three blank lines between declarations collapse to one"
source = '''
let a = 1;



let b = 2;'''
output = '''
let a = 1;

let b = 2;
'''

[[case]]
why = "preserve: blank lines: one blank line is preserved as one"
source = '''
let x = 1;

let y = 2'''
output = '''
let x = 1;

let y = 2
'''

[[case]]
why = "preserve: blank lines: declarations on one line are split, and no blank line is invented between them"
source = 'let x = 1; let y = 2;'
output = '''
let x = 1;
let y = 2;
'''

[[case]]
why = "preserve: blank lines: blank lines inside a broken block are kept, a run collapses to one"
source = '''
func f() : Nat {

 let x = 1;


 x
}'''
output = '''
func f() : Nat {

  let x = 1;

  x
}
'''

[[case]]
why = "preserve: blank lines: so are blank lines at the edges of a switch and between its arms"
source = '''
switch x {

  case 1 {}


  case _ {}

}'''
output = '''
switch x {

  case 1 {}

  case _ {}

}
'''

[[case]]
why = "preserve: the import section: a blank line after the imports is kept"
source = '''
import A "A";

actor {};
'''
output = '''
import A "A";

actor {};
'''

[[case]]
why = "preserve: the import section: no blank line is invented after the imports"
source = '''
import A "A";
// note
actor {};
'''
output = '''
import A "A";
// note
actor {};
'''

[[case]]
why = "preserve: the import section: a leading blank before the first import is dropped"
source = "\n\nimport A \"A\";\nactor {}"
output = '''
import A "A";
actor {}
'''

[[case]]
why = "preserve: untouched constructs: the number-dot seam is lexical, so no space may appear before the dot"
source = 'let r = 1.toText()'
output = '''
let r = 1.toText()
'''

[[case]]
why = "preserve: untouched constructs: a juxtaposed application is preserved — `tight-apply` is a moc2 edit, not this one"
source = 'f x'
output = '''
f x
'''

[[case]]
why = "preserve: untouched constructs: a multi-line string literal is opaque source text and is not re-indented"
source = '''
let s = "a
b"'''
output = '''
let s = "a
b"
'''

[[case]]
why = "preserve: untouched constructs: an anonymous object with a member is a nested list inside an expression"
source = 'let o = object { public func f() : Nat { 1 } }'
output = '''
let o = object { public func f() : Nat { 1 } }
'''

[[case]]
why = "preserve: untouched constructs: a parenthesised expression in a body keeps its parens"
source = 'func f() : Nat { (1) }'
output = '''
func f() : Nat { (1) }
'''

[[case]]
why = "preserve: untouched constructs: an if/else chain is not merged or split across lines when it fits"
source = 'let x = if c { 1 } else { 2 }'
output = '''
let x = if c { 1 } else { 2 }
'''

[[case]]
why = "preserve: idempotence and options: printWidth never breaks a list"
source = 'let r = { alpha = 1; beta = 2; gamma = 3; delta = 4; epsilon = 5; zeta = 6; eta = 7 }'
output = '''
let r = { alpha = 1; beta = 2; gamma = 3; delta = 4; epsilon = 5; zeta = 6; eta = 7 }
'''

[[case]]
why = "preserve: the angle close: an instantiation list glues its close too"
source = '''
type L = List<List<Nat>>;
let x = L.make<
  Alpha,
  Beta>();'''
output = '''
type L = List<List<Nat>>;
let x = L.make<
  Alpha,
  Beta>();
'''

[[case]]
why = "preserve: the angle close: no printed angle list anywhere ends a line before its `>`"
source = '''
func f<
  Alpha,
  Beta,
  Gamma <: List<Nat>>(a : Alpha) : Beta = a;'''
output = '''
func f<
  Alpha,
  Beta,
  Gamma <: List<Nat>>(a : Alpha) : Beta = a;
'''

[[case]]
why = "preserve: the angle close: no printed angle list anywhere ends a line before its `>`"
source = '''
class C<
  Alpha,
  Beta>(a : Alpha) { public let b : Beta; };'''
output = '''
class C<
  Alpha,
  Beta>(a : Alpha) { public let b : Beta; };
'''

[[case]]
why = "preserve: the angle close: no printed angle list anywhere ends a line before its `>`"
source = '''
let x = f<
  Alpha,
  Beta,
  Gamma>();'''
output = '''
let x = f<
  Alpha,
  Beta,
  Gamma>();
'''

[[case]]
why = "moc2: a case pattern glued to `case` gets a space when its parens go"
config = { syntax = "moc2" }
source = '''
switch x { case(null) { 0 }; case(?y){ y } };
'''
output = '''
switch x { case null { 0 } case ?y { y } }
'''
