# Input and expected output for each case the TypeScript formatter this was ported from was tested with.
# Every case is also checked to be a fixed point, and one with a `config` to be a fixed point of preserve too.

[[case]]
why = "spacing: an atomic head stays bare, since wrapping `if c` would be a gratuitous change"
source = 'func f(c : Bool) : Nat { if c { 1 } else { 2 } }'
output = '''
func f(c : Bool) : Nat { if c { 1 } else { 2 } }
'''

[[case]]
why = "spacing: an already parenthesised compound head is kept, not double-wrapped, and `preserve` doesn't unwrap it either"
source = '''
func g(x : Nat) : Nat { 1 };
func f(x : Nat) : Nat { if (g(x)) { 1 } else { 2 } }'''
output = '''
func g(x : Nat) : Nat { 1 };
func f(x : Nat) : Nat { if (g(x)) { 1 } else { 2 } }
'''

[[case]]
why = "spacing: a bare indexed head is kept in `preserve` even though moc 1.16 rejects it; tidying it is `moc2`'s job"
source = 'func f(xs : [Nat]) : Nat { if xs[0] { 1 } else { 2 } }'
output = '''
func f(xs : [Nat]) : Nat { if xs[0] { 1 } else { 2 } }
'''

[[case]]
why = "spacing: a unary branch glued to its head is kept verbatim in `preserve`, although moc 2.0 rejects it; only `moc2` may add the space"
source = 'func f(c : Bool) : Nat { if (c)-1 else 2 }'
output = '''
func f(c : Bool) : Nat { if (c)-1 else 2 }
'''

[[case]]
why = "spacing: a unary branch spaced from its head is the one spelling every moc version accepts, and is kept"
source = 'func f(c : Bool) : Nat { if (c) -1 else 2 }'
output = '''
func f(c : Bool) : Nat { if (c) -1 else 2 }
'''

[[case]]
why = "spacing: a variant branch spaced from its head keeps its space, which is load-bearing"
source = 'func f(c : Bool) : any { if (c) #less else #greater }'
output = '''
func f(c : Bool) : any { if (c) #less else #greater }
'''

[[case]]
why = "spacing: a comparison is spaced on both sides, so its `>` can't re-lex as a closing angle"
source = 'let b = x < y'
output = '''
let b = x < y
'''

[[case]]
why = "spacing: an instantiating `<` stays glued to the callee; spaced, `f <Nat>(1)` reads as a comparison"
source = 'let x = f<Nat>(1)'
output = '''
let x = f<Nat>(1)
'''

[[case]]
why = "spacing: in a broken type-argument list the `<` stays glued to `f` and the `>` to `Nat`"
source = '''
let x = f<
  Nat>(1)'''
output = '''
let x = f<
  Nat>(1)
'''

[[case]]
why = "spacing: a nested close is one contiguous `>>`, since `> >` would end the outer list early"
source = 'type T = List<List<Nat>>'
output = '''
type T = List<List<Nat>>
'''

[[case]]
why = "spacing: a broken angle list glues its close to the last item, since a `>` on its own line doesn't parse"
source = '''
type F<
  Alpha,
  Beta,
  Gamma> = Alpha;'''
output = '''
type F<
  Alpha,
  Beta,
  Gamma> = Alpha;
'''

[[case]]
why = "spacing: an item that ends a nested angle list still leaves the outer `>>` contiguous"
source = '''
func f<
  Alpha,
  Beta <: List<Nat>>(
  a : Alpha
) : Beta = a;'''
output = '''
func f<
  Alpha,
  Beta <: List<Nat>>(
  a : Alpha
) : Beta = a;
'''

[[case]]
why = "spacing: `??` is spaced and never broken, so its leading `?` can't become a second option type"
source = 'let x = a ?? b'
output = '''
let x = a ?? b
'''

[[case]]
why = "spacing: the space in `? ?Nat` is meaningful and is kept"
source = 'let x : ? ?Nat = null'
output = '''
let x : ? ?Nat = null
'''

[[case]]
why = "spacing: a tight `??Nat` type stays tight, and isn't respaced into an operator"
source = 'let x : ??Nat = null'
output = '''
let x : ??Nat = null
'''

[[case]]
why = "spacing: a number glued to `.` stays glued, since `5. toText()` lexes a Float; the guard can't see this, so the printer must"
source = 'let s = 5.toText()'
output = '''
let s = 5.toText()
'''

[[case]]
why = "spacing: `#` stays glued to its variant tag"
source = 'let v = #ok(1)'
output = '''
let v = #ok(1)
'''

[[case]]
why = "spacing: a concatenating `#` is spaced on both sides, the opposite of a variant tag"
source = 'let s = "a" # "b"'
output = '''
let s = "a" # "b"
'''

[[case]]
why = "spacing: `:=` is one token, so it is never split"
source = 'func f() { a := b }'
output = '''
func f() { a := b }
'''

[[case]]
why = "spacing: `**` is one token, so it is never split"
source = 'func f() { let x = a ** b }'
output = '''
func f() { let x = a ** b }
'''

[[case]]
why = "spacing: a wrapping operator such as `+%` is one token, so it is never split"
source = 'func f() { let x = a +% b }'
output = '''
func f() { let x = a +% b }
'''

[[case]]
why = "spacing: a chain broken at a shift keeps `>>` whole, since its two `>` come from one token"
source = '''
func f() {
  let x = aaaaaaaa >>
    bbbbbbbb
}'''
output = '''
func f() {
  let x = aaaaaaaa >>
    bbbbbbbb
}
'''

[[case]]
why = "comments: a comment before a glued `>` stays where it is, since moc rejects whitespace before that `>` even with a comment there"
source = '''
type F<
  Alpha,
  Beta /*c*/> = Alpha;'''
output = '''
type F<
  Alpha,
  Beta /*c*/> = Alpha;
'''

[[case]]
why = "comments: an own-line comment before a `>` stays on its own line"
source = '''
type F<Alpha, Beta
  /*c*/> = Alpha;'''
output = '''
type F<
  Alpha,
  Beta
  /*c*/> = Alpha;
'''

[[case]]
why = "moc2: if branches are braced"
config = { syntax = "moc2" }
source = '''
if (c) x else y;
'''
output = '''
if c { x } else { y }
'''

[[case]]
why = "moc2: an else-if chain stays a chain"
config = { syntax = "moc2" }
source = '''
let a = if (c) 1 else if (d) 2 else { 3 };
'''
output = '''
let a = if c { 1 } else if d { 2 } else { 3 }
'''

[[case]]
why = "moc2: while"
config = { syntax = "moc2" }
source = '''
while (c) f();
'''
output = '''
while c { f() }
'''

[[case]]
why = "moc2: for"
config = { syntax = "moc2" }
source = '''
for (x in xs.values()) f(x);
'''
output = '''
for x in xs.values() { f(x) }
'''

[[case]]
why = "moc2: loop keeps its trailing condition, unparenthesized"
config = { syntax = "moc2" }
source = '''
loop f() while (c);
loop { f() } while (g x);
'''
output = '''
loop { f() } while c;
loop { f() } while g(x)
'''

[[case]]
why = "moc2: try, catch and finally"
config = { syntax = "moc2" }
source = '''
try f() catch e g();
try f() catch (e : Error) { g() } finally h();
'''
output = '''
try { f() } catch e { g() };
try { f() } catch e : Error { g() } finally { h() }
'''

[[case]]
why = "moc2: async bodies, with or without a parenthetical"
config = { syntax = "moc2" }
source = '''
let a = async 42;
let b = async* f();
let c = (with cycles = 1) async g();
let d = async { 1 };
'''
output = '''
let a = async { 42 };
let b = async* { f() };
let c = (with cycles = 1) async { g() };
let d = async { 1 }
'''

[[case]]
why = "moc2: a block after an operator-like keyword is spelled `do { … }`"
config = { syntax = "moc2" }
source = '''
let ?u = get(id) else { return null };
let ?v = get(id) else return null;
label l : Nat { break l 1 };
label k while (c) { break k };
debug { log() };
ignore { x };
assert { true };
throw { e };
await { f() };
loop { } while { c };
'''
output = '''
let ?u = get(id) else do { return null };
let ?v = get(id) else return null;
label l : Nat do { break l 1 };
label k while c { break k };
debug do { log() };
ignore do { x };
assert do { true };
throw do { e };
await do { f() };
loop {} while do { c }
'''

[[case]]
why = "moc2: a glued block after a keyword gets its space"
config = { syntax = "moc2" }
source = '''
let ?u = get(id) else{ return null };
'''
output = '''
let ?u = get(id) else do { return null }
'''

[[case]]
why = "moc2: `or`, `and` and `: T` patterns drop their parentheses, payloads and all"
config = { syntax = "moc2" }
source = '''
switch x { case (0 or 1) { a }; case (#a v or #b v) { v }; case (?y and z) { z }; case (n : Nat) { n }; case (#c (p, q) : T) { p } };
'''
output = '''
switch x { case 0 or 1 { a } case #a(v) or #b(v) { v } case ?y and z { z } case n : Nat { n } case #c(p, q) : T { p } }
'''

[[case]]
why = "moc2: case arms, separators and patterns"
config = { syntax = "moc2" }
source = '''
switch (x) { case (null) 0; case (?y) { y }; case (#t z) z; case (#u) 1 };
'''
output = '''
switch x { case null { 0 } case ?y { y } case #t(z) { z } case #u { 1 } }
'''

[[case]]
why = "rules: `brace-bodies` alone braces the arms and leaves the rest as written"
config = { brace-bodies = true }
source = '''
switch (x) { case (null) 0; case (?y) { y }; case (#t z) z; case (#u) 1 };
'''
output = '''
switch (x) { case (null) { 0 }; case (?y) { y }; case (#t z) { z }; case (#u) { 1 } };
'''

[[case]]
why = "rules: `moc2` with two rules turned off"
config = { syntax = "moc2", unparen-heads = false, unparen-patterns = false }
source = '''
switch (x) { case (null) 0; case (?y) { y }; case (#t z) z; case (#u) 1 };
'''
output = '''
switch (x) { case (null) { 0 } case (?y) { y } case (#t z) { z } case (#u) { 1 } }
'''

[[case]]
why = "rules: `semicolons` alone drops only the `;` after a braced arm"
config = { semicolons = "minimal" }
source = '''
switch (x) { case (null) 0; case (?y) { y }; case (#u) 1 };
'''
output = '''
switch (x) { case (null) 0; case (?y) { y } case (#u) 1 }
'''

[[case]]
why = "rules: `unparen-heads` alone skips a head whose branches aren't braced"
config = { unparen-heads = true }
source = '''
if (c) x else y;
if (c) { x } else { y };
'''
output = '''
if (c) x else y;
if c { x } else { y };
'''

[[case]]
why = "rules: `semicolons = minimal` drops the `;` after the last item of every `;` list, and keeps the ones between items"
config = { semicolons = "minimal" }
source = '''
func f() { a; b; };
let r = { x = 1; y = 2; };
type V = { #a; #b; };
let k = {
  a; // last
};
'''
output = '''
func f() { a; b };
let r = { x = 1; y = 2 };
type V = { #a; #b };
let k = {
  a // last
}
'''

[[case]]
why = "rules: `trailing-commas = multiline` puts one on a broken list, after a trailing comment's item, and takes it off a one-line list"
config = { trailing-commas = "multiline" }
source = '''
let c = (1, 2,);
let m = add(
  map,
  key // the key
);
let arr = [
  1,
  2
];
'''
output = '''
let c = (1, 2);
let m = add(
  map,
  key, // the key
);
let arr = [
  1,
  2,
];
'''

[[case]]
why = "rules: `trailing-commas = multiline` leaves a parenthesised single item and a `<…>` list without one"
config = { trailing-commas = "multiline" }
source = '''
let one = (
  a + b,
);
let g = f<
  Nat,
  Text>(1);
'''
output = '''
let one = (
  a + b
);
let g = f<
  Nat,
  Text>(1);
'''

[[case]]
why = "rules: `trailing-commas = never`"
config = { trailing-commas = "never" }
source = '''
func h(x : Nat,) {};
let arr = [
  1,
  2,
];
'''
output = '''
func h(x : Nat) {};
let arr = [
  1,
  2
];
'''

[[case]]
why = "rules: `block-blank-lines = trim` drops blank lines just inside braces and keeps the ones between items"
config = { block-blank-lines = "trim" }
source = '''
actor {

  func g() {

    a;

    b

  };

  let e = {

  };
};
'''
output = '''
actor {
  func g() {
    a;

    b
  };

  let e = {};
};
'''

[[case]]
why = "rules: `imports = organize` groups packages, canisters and local files, sorts by path, and keeps each comment with its import"
config = { imports = "organize" }
source = '''
// Copyright header

import Utils "./utils"; // helpers
import Text "mo:core/Text";
// the ledger
import Ledger "canister:ledger";
import Array "mo:core/Array";

import { f } "../lib/f";

actor {};
'''
output = '''
// Copyright header

import Array "mo:core/Array";
import Text "mo:core/Text";

// the ledger
import Ledger "canister:ledger";

import { f } "../lib/f";
import Utils "./utils"; // helpers

actor {};
'''

[[case]]
why = "rules: `imports = organize` keeps a file's last `;` as written"
config = { imports = "organize" }
source = '''
import B "mo:b";
import A "mo:a"
'''
output = '''
import A "mo:a";
import B "mo:b"
'''

[[case]]
why = "rules: `imports = organize` keeps a comment that a blank line sets apart inside the imports"
config = { imports = "organize" }
source = '''
import B "mo:b";

// section

import A "mo:a";
'''
output = '''
// section
import A "mo:a";
import B "mo:b";
'''

[[case]]
why = "rules: commas go first, so a head that `(x,)` → `(x)` frees loses its parentheses in the same run"
config = { syntax = "moc2", trailing-commas = "never" }
source = '''
let _ = switch (42,) { case (3,) 3; case (a,) a };
'''
output = '''
let _ = switch 42 { case 3 { 3 } case a { a } }
'''

[[case]]
why = "rules: an item after `// mo-fmt-ignore` is left as written by the rules too"
config = { syntax = "moc2", trailing-commas = "never" }
source = '''
// mo-fmt-ignore
let a = if (c) 1 else 2;
let b = if (c) 1 else 2;
func f() {
  // mo-fmt-ignore
  let x = [1,2,];
  x
};
'''
output = '''
// mo-fmt-ignore
let a = if (c) 1 else 2;
let b = if c { 1 } else { 2 };
func f() {
  // mo-fmt-ignore
  let x = [1,2,];
  x
}
'''

[[case]]
why = "rules: `unparen-heads` without `brace-bodies` keeps a head whose `else if` chain has a bare branch further down"
config = { syntax = "moc2", brace-bodies = false }
source = '''
let c = if (i == 0) { 0 } else if (a) 1 else 2;
let d = if (i == 0) { 0 } else if (a) { 1 } else { 2 };
'''
output = '''
let c = if (i == 0) { 0 } else if (a) 1 else 2;
let d = if i == 0 { 0 } else if a { 1 } else { 2 }
'''

[[case]]
why = "rules: a spaced call in a `loop … while` condition is glued so its parentheses can go"
config = { syntax = "moc2" }
source = '''
loop { x() } while (f x);
'''
output = '''
loop { x() } while f(x)
'''

[[case]]
why = "rules: `do-blocks` alone"
config = { do-blocks = true }
source = '''
let ?u = get(id) else { return null };
if (c) x else y;
'''
output = '''
let ?u = get(id) else do { return null };
if (c) x else y;
'''

[[case]]
why = "rules: `moc2` without `do-blocks` keeps a bare block after `else`"
config = { syntax = "moc2", do-blocks = false }
source = '''
let ?u = get(id) else { return null };
'''
output = '''
let ?u = get(id) else { return null }
'''

[[case]]
why = "rules: `unparen-patterns` alone unwraps only braced arms"
config = { unparen-patterns = true }
source = '''
switch (x) { case (#a v) { v }; case (#b) 1 };
'''
output = '''
switch (x) { case #a(v) { v }; case (#b) 1 };
'''

[[case]]
why = "rules: a variant with a payload under `?` gets its `#tag(…)` too, or moc reads `x` as the body"
config = { syntax = "moc2" }
source = '''
switch o { case (?#a x) { x }; case (?#b or ?#c y) { y } };
'''
output = '''
switch o { case ?#a(x) { x } case ?#b or ?#c(y) { y } }
'''

[[case]]
why = "rules: a `for` head with a line comment or a line break inside the parentheses keeps them"
config = { syntax = "moc2" }
source = '''
for (x in xs.vals() // c
) { ignore x };
for (x in
  xs.vals()) { ignore x };
'''
output = '''
for (x in xs.vals() // c
) { ignore x };
for (x in
  xs.vals()) { ignore x }
'''

[[case]]
why = "rules: `trailing-commas` doesn't take the `var` of an array for an item"
config = { trailing-commas = "multiline" }
source = '''
let a : [var Nat] = [var
];
'''
output = '''
let a : [var Nat] = [
  var
];
'''

[[case]]
why = "rules: `imports = organize` keeps every comment that ends an import's line with it"
config = { imports = "organize" }
source = '''
import B "mo:b"; /* x */ // y
import A "mo:a";
'''
output = '''
import A "mo:a";
import B "mo:b"; /* x */ // y
'''

[[case]]
why = "moc2: heads with no hazard outside nested parens"
config = { syntax = "moc2" }
source = '''
if (x != #a and not (p y)) {};
switch (f(a, #b, -1)) {};
if (i +% 1 < n) {};
if (s != "{" and any(func() { t })) {};
if (a-1 > 0) {};
'''
output = '''
if x != #a and not (p y) {};
switch f(a, #b, -1) {};
if i +% 1 < n {};
if s != "{" and any(func() { t }) {};
if a - 1 > 0 {}
'''

[[case]]
why = "moc2: spaced calls and indexes in heads are glued"
config = { syntax = "moc2" }
source = '''
if (not f x y) {};
while (g (x) and a [i]) {};
for (x in h<T> xs) {};
'''
output = '''
if not f(x)(y) {};
while g(x) and a[i] {};
for x in h<T>(xs) {}
'''

