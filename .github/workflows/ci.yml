name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  bindings-in-sync:
    name: Bindings in sync with tree-sitter.json
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          cache: npm
          node-version: "22"
      - run: npm i --omit peer --omit optional
      - run: npx tree-sitter init --update
      - name: Check for drift
        run: |
          if ! git diff --exit-code; then
            echo "::error::Bindings are out of sync with tree-sitter.json. Run 'tree-sitter init --update' locally and commit the result."
            exit 1
          fi

  test:
    name: Test grammar against compiler corpus
    runs-on: ubuntu-24.04
    steps:
      # Checkout all three repos as siblings under $GITHUB_WORKSPACE so that
      # ../motoko and ../motoko-core resolve correctly from tree-sitter-motoko/.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: tree-sitter-motoko

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: caffeinelabs/motoko
          path: motoko
          fetch-depth: 1
          sparse-checkout: |
            test/fail
            test/run

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: caffeinelabs/motoko-core
          path: motoko-core
          fetch-depth: 1
          sparse-checkout: |
            src
            test
            bench

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          cache: npm
          cache-dependency-path: tree-sitter-motoko/package-lock.json
          node-version: "22"

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: tree-sitter-motoko/dev

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - run: npm ci --omit peer --omit optional
        working-directory: tree-sitter-motoko

      - run: just test-generate
        working-directory: tree-sitter-motoko

      - run: just test
        working-directory: tree-sitter-motoko

      # `just test` regenerates src/, so a stale commit (e.g. a version bump without `tree-sitter generate`) shows up here
      - name: Generated sources match grammar.js and tree-sitter.json
        run: git diff --exit-code -- src/
        working-directory: tree-sitter-motoko

  packages:
    name: Parse production packages at source head
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          cache: npm
          node-version: "22"

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - run: npm ci --omit peer --omit optional

      - run: just packages

  mo-fmt:
    name: mo-fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: tree-sitter-motoko

      # Pinned, since the corpus test requires motoko-core to be formatted already.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: caffeinelabs/motoko
          ref: dfa3a92abca9994512434f9701175e7e499fb0df
          path: motoko
          sparse-checkout: test

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: caffeinelabs/motoko-core
          ref: 96a8e1f76f44088709ef38e426c65d1fe829ee07
          path: motoko-core

      # mo-fmt/rust-toolchain.toml pins the toolchain; 1.90 is the `rust-version` it must also build on.
      - run: rustup toolchain install && rustup toolchain install 1.90 --profile minimal
        working-directory: tree-sitter-motoko/mo-fmt

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: tree-sitter-motoko/mo-fmt

      - run: cargo fmt --check
        working-directory: tree-sitter-motoko/mo-fmt

      - run: cargo +1.90 check --all-targets --locked
        working-directory: tree-sitter-motoko/mo-fmt

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: tree-sitter-motoko/mo-fmt/Cargo.toml

      - run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: tree-sitter-motoko/mo-fmt

      - run: cargo test --locked
        working-directory: tree-sitter-motoko/mo-fmt
        env:
          MOTOKO_CORPUS_REQUIRED: 1

  required:
    name: ci:required
    runs-on: ubuntu-24.04
    if: always()
    needs: [bindings-in-sync, test, packages, mo-fmt]
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
